<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Big Digital Clock</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="clock">
    <div id="time">
      <span id="hours"></span> :
      <span id="minutes"></span> :
      <span id="seconds"></span>
      <span id="ampm"></span>
    </div>
    <div id="date"></div>
    <div id="greeting"></div>
  </div>
  <script src="script.js"></script>
</body>
</html>
